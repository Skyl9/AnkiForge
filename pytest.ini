[pytest]
testpaths = tests
pythonpath = .
addopts = -n auto --dist=loadfile
timeout = 30.0

timeout_method = thread
markers =
    slow: Tests lents ou coûteux en temps (> 1s, exclus du pre-commit rapide)
    integration: Tests d'intégration avec BDD, I/O de fichiers ou workers asynchrones
    ui: Tests d'interface graphique Qt / PySide6
filterwarnings =
    # Ignore les warnings SWIG liés à Python 3.12
    ignore:builtin type SwigPy.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning
