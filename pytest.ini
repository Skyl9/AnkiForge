[pytest]
testpaths = tests
pythonpath = .
addopts = -n auto --dist=loadfile --strict-markers
timeout = 30.0

timeout_method = thread
markers =
    unit: Tests unitaires purs et algorithmiques (< 10ms, sans BDD ni GUI)
    integration: Tests d'intégration avec BDD, repositories, workers ou I/O
    ui: Tests d'interface graphique Qt / PySide6 (qtbot, widgets, vues)
    slow: Tests de bout en bout, de charge ou lents (> 1s)
filterwarnings =

    # Ignore les warnings SWIG liés à Python 3.12
    ignore:builtin type SwigPy.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning
