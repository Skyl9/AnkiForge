# pyproject.toml
[project]
name = "ankiforge"
version = "0.2.0"
description = "Générateur de cartes Anki assisté par IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.0",
    "peewee>=3.17.0",
    "jinja2>=3.1.0",
    "genanki>=0.13.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "zstandard>=0.25.0",
    "protobuf>=7.34.1",
    "qtawesome>=1.4.1",
    "markdown",
    "google-genai",
    "platformdirs>=4.9.4",
    "marker-pdf>=1.10.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.14.3",
    "markdownify>=1.2.2",
    "peewee-migrate>=1.15.0",
    "youtube-transcript-api>=0.6.0",
    "mcp>=2.0.0",
    "faiss-cpu>=1.14.3",
    "numpy>=2.4.4",
    "chromadb>=1.5.9",
    "zensical>=0.0.52",
]

[project.gui-scripts]
ankiforge = "ankiforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "zensical>=0.0.52",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "bandit>=1.9.4",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "mypy>=1.20.0",
    "nuitka>=4.0.7",
    "pre-commit>=4.5.1",
    "pyinstaller>=6.19.0",
    "ruff>=0.15.10",
    "tiktoken>=0.12.0",
    "types-markdown>=3.10.2.20260408",
    "types-peewee>=4.0.0.20260408",
    "types-requests>=2.33.0.20260408",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
]

[tool.ruff]
# On autorise des lignes plus longues (200) pour ne pas casser les prompts IA
line-length = 200
target-version = "py312"
extend-exclude = ["script/tools", "script/ui_rebuild"]

[tool.ruff.lint]
# E/F/B: PEP8 & bugs, I: isort, UP: pyupgrade 3.12, T20: zero print, PT: pytest style, SIM: simplify
select = ["E", "F", "B", "I", "UP", "T20", "PT", "SIM"]
ignore = ["SIM105", "UP038"]



[tool.ruff.lint.per-file-ignores]
"script/*" = ["T201", "T203"]  # Les scripts CLI utilisent print() pour la sortie console
"tests/*" = ["T201", "PT004", "PT011", "PT018"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "peewee.*",
    "requests.*",
    "genanki.*",
    "marker.*",
    "youtube_transcript_api.*",
    "trafilatura.*",
    "markdownify.*",
    "docx.*",
    "pptx.*",
    "qtawesome.*",
    "chromadb.*",
    "faiss.*",
    "zensical.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ankiforge.database.migrations.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "ankiforge.ui.*"
disallow_untyped_defs = false
disable_error_code = [
    "attr-defined",
    "assignment",
    "method-assign",
    "arg-type",
    "union-attr",
    "operator",
    "call-arg",
    "index",
    "misc",
    "return-value",
    "call-overload",
]




[tool.bandit]
# On exclut le dossier des tests pour Bandit, car on y utilise souvent des assertions ou des fausses données
exclude_dirs = ["tests"]
skips = ["B104", "B110"] # B104 (bind), B110 (try-except-pass pour UI/fallbacks)
