name: CI - Quality & Tests

on:
  push:
    branches:
      - main
      - master
      - refonte
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-software-rasterizer --offscreen --disable-dev-shm-usage"
  ANKIFORGE_MOCK_WEBENGINE: "1"

jobs:
  # ── 1. Smart Path Filtering (Économie des runners) ──
  filter:
    name: 🔍 Smart Path Filter
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'script/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            docs:
              - '*.md'
              - 'docs/**'
              - 'Dossier_architecture/**'

  # ── 2. Security: Secret Scanning (Gitleaks Zero-Trust) ──
  secret-scan:
    name: 🔑 Gitleaks (Secret Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Parallel Quality & Security Fan-Out ──
  lint-ruff:
    name: ⚡ Ruff (Lint & Format)
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Check Ruff Formatting
        run: uv run ruff format --check .

      - name: Run Ruff Linter with GitHub Annotations
        run: uv run ruff check --output-format=github .


  typecheck-mypy:
    name: 🛡️ Mypy Strict (100%)
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run Mypy Type Checking
        run: uv run mypy src/ankiforge

  security-bandit:
    name: 🔒 Bandit Security Scan
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run Bandit Security Analysis
        run: uv run bandit -c pyproject.toml -r src/

  audit-dependencies:
    name: 🛡️ Supply Chain Security (pip-audit)
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Audit Dependencies for Known CVEs
        run: uv run --with pip-audit pip-audit --local --skip-editable || true

  # ── 4. Multi-OS Parallel Test Matrix ──
  test:
    name: 🧪 Tests on ${{ matrix.os }}
    needs: [filter, secret-scan, lint-ruff, typecheck-mypy, security-bandit, audit-dependencies]
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & Qt Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libnss3 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            gcc || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Compile Native C Levenshtein Extension (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O3 -flto -shared -o src/ankiforge/c_ext/levenshtein_distance.so -fPIC src/ankiforge/c_ext/levenshtein_distance.c || true

      - name: Compile Native C Levenshtein Extension (macOS Universal 2)
        if: runner.os == 'macOS'
        run: |
          clang -O3 -flto -shared -fPIC -arch arm64 -arch x86_64 -o src/ankiforge/c_ext/levenshtein_distance.so src/ankiforge/c_ext/levenshtein_distance.c || true

      - name: Compile Native C Levenshtein Extension (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -O3 -flto -shared -o src/ankiforge/c_ext/levenshtein_distance.dll src/ankiforge/c_ext/levenshtein_distance.c || true
        shell: bash


      - name: Run Tests with Coverage (Linux with Xvfb)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: "offscreen"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-software-rasterizer --offscreen --disable-dev-shm-usage"
          ANKIFORGE_MOCK_WEBENGINE: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" uv run pytest -n auto --cov=ankiforge --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Run Tests with Coverage (macOS & Windows)
        if: runner.os != 'Linux'
        run: |
          uv run pytest -n auto --cov=ankiforge --cov-report=xml --cov-report=term

      - name: Generate GitHub Step Summary Report
        if: matrix.os == 'ubuntu-latest' && always()
        run: |
          uv run python script/generate_ci_summary.py coverage.xml

      - name: Upload Test Coverage Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore


  # ── 5. Packaging & Binary Smoke Test ──
  build-smoke-test:
    name: 📦 Packaging & Binary Smoke Test
    needs: [filter, lint-ruff, typecheck-mypy, security-bandit]
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            gcc || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Execute Binary Build & Smoke Test
        env:
          QT_QPA_PLATFORM: "offscreen"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          xvfb-run --auto-servernum uv run python script/build_smoke_test.py
