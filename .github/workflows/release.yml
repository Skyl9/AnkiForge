name: Release - Automated Multi-OS Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du Tag de Release (ex: v0.2.0)'
        required: true
        default: 'v0.2.0'
      is_prerelease:
        description: 'Marquer comme Pre-Release'
        type: boolean
        default: false
      draft_release:
        description: 'Créer comme Brouillon (Draft)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  ANKIFORGE_MOCK_WEBENGINE: "1"
  ACTIONS_RUNNER_FORCE_NODE24: "true"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  # ── 1. Construction des Binaires & Installeurs Multi-OS ──
  build:
    name: 📦 Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
          - os: macos-latest
            os_name: macos
            arch: arm64
          - os: windows-latest
            os_name: windows
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies & Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libpulse0 \
            libasound2 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libfuse2 \
            ccache \
            gcc || true

      - name: Install macOS Build Tools (ccache)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ccache || true

      - name: Cache Nuitka & C Compiler Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~\AppData\Local\Nuitka\Nuitka\Cache
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ~\AppData\Local\ccache
          key: nuitka-${{ matrix.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/ankiforge/**') }}
          restore-keys: |
            nuitka-${{ matrix.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ matrix.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (Production runtime + Nuitka only)
        run: uv sync --frozen --no-dev --group build

      # ── Compilation Nuitka ──
      - name: Build Binary with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build_script/build_prod_linux.sh
          ./build_script/build_prod_linux.sh

      - name: Build Binary with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_script/build_prod_mac.sh
          ./build_script/build_prod_mac.sh

      - name: Disable Windows Defender for Build Performance (Windows)
        if: runner.os == 'Windows'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath (Get-Location).Path, $env:TEMP, $env:LOCALAPPDATA -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Binary with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build_script\build_prod_windows.ps1
        shell: pwsh

      # ── Tests de validation (Smoke Tests) ──
      - name: Smoke Test Binary (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum ./dist_prod/AnkiForge.dist/AnkiForge --smoke-test

      - name: Smoke Test Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist_prod/AnkiForge.app/Contents/MacOS/AnkiForge --smoke-test

      - name: Smoke Test Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist_prod\AnkiForge.dist\AnkiForge.exe --smoke-test
        shell: pwsh

      # ── Empaquetage Linux (.AppImage + .tar.gz) ──
      - name: Package Linux AppImage & Tarball
        if: runner.os == 'Linux'
        run: |
          chmod +x build_script/package_appimage.sh
          ./build_script/package_appimage.sh

          tar -czf ankiforge-linux-x86_64.tar.gz -C dist_prod AnkiForge.dist/
          sha256sum AnkiForge-x86_64.AppImage ankiforge-linux-x86_64.tar.gz > linux_checksums.sha256

      # ── Empaquetage macOS (.dmg + .zip) ──
      - name: Package macOS DMG & Zip
        if: runner.os == 'macOS'
        run: |
          chmod +x build_script/package_dmg.sh
          ./build_script/package_dmg.sh

          cd dist_prod
          zip -r ../ankiforge-macos-arm64.zip AnkiForge.app/
          cd ..
          shasum -a 256 AnkiForge-macos-arm64.dmg ankiforge-macos-arm64.zip > macos_checksums.sha256

      # ── Empaquetage Windows (Inno Setup .exe + .zip) ──
      - name: Package Windows Installer & Zip
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build_script\windows_installer.iss
          } else {
              iscc build_script\windows_installer.iss
          }

          Compress-Archive -Path dist_prod\AnkiForge.dist -DestinationPath ankiforge-windows-x64.zip

          $files = @("AnkiForge-Setup-x64.exe", "ankiforge-windows-x64.zip")
          foreach ($f in $files) {
              if (Test-Path $f) {
                  $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
                  "$hash  $f" | Out-File -Append -Encoding ascii windows_checksums.sha256
              }
          }
        shell: pwsh

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_name }}
          path: |
            *.AppImage
            *.tar.gz
            *.dmg
            *.exe
            *.zip
            *.sha256
          if-no-files-found: warn

  # ── 2. Publication Automatique de la GitHub Release ──
  publish:
    name: 🚀 Publish GitHub Release & Cryptographic Attestations
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Consolidate SHA-256 Checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          echo "### 🔒 Empreintes Cryptographiques SHA-256 :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat checksums.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Cryptographic Build Attestation (SLSA Level 3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/AnkiForge-x86_64.AppImage
            release-assets/ankiforge-linux-x86_64.tar.gz
            release-assets/AnkiForge-macos-arm64.dmg
            release-assets/ankiforge-macos-arm64.zip
            release-assets/AnkiForge-Setup-x64.exe
            release-assets/ankiforge-windows-x64.zip

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "AnkiForge ${{ steps.tag.outputs.version }}"
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft_release == 'true' }}
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
