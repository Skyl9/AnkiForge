name: Release - Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: 📦 Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: AnkiForge-macOS
            asset_name: AnkiForge-macOS.zip
          - os: ubuntu-latest
            artifact_name: AnkiForge-Linux
            asset_name: AnkiForge-Linux.tar.gz
          - os: windows-latest
            artifact_name: AnkiForge-Windows
            asset_name: AnkiForge-Windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb1 \
            gcc

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile Native C Levenshtein Extension (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          gcc -shared -o src/ankiforge/c_ext/levenshtein_distance.so -fPIC src/ankiforge/c_ext/levenshtein_distance.c || true

      - name: Compile Native C Levenshtein Extension (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -shared -o src/ankiforge/c_ext/levenshtein_distance.dll src/ankiforge/c_ext/levenshtein_distance.c || true
        shell: bash

      # ── BUILD MACOS ─────────────────────────────────────────────
      - name: Build Standalone macOS App (PyInstaller)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller build_script/AnkiForge.spec --noconfirm --distpath dist
          cd dist
          zip -r ../${{ matrix.asset_name }} AnkiForge.app

      # ── BUILD LINUX ─────────────────────────────────────────────
      - name: Build Standalone Linux App (PyInstaller)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller \
            --name="AnkiForge" \
            --onedir \
            --windowed \
            --add-data="src/ankiforge/c_ext/levenshtein_distance.so:ankiforge/c_ext" \
            --collect-data="qtawesome" \
            --hidden-import="peewee" \
            --hidden-import="jinja2.ext" \
            --hidden-import="PySide6.QtWebEngineCore" \
            --hidden-import="PySide6.QtWebEngineWidgets" \
            --noconfirm \
            --distpath dist \
            src/ankiforge/__main__.py
          tar -czf ${{ matrix.asset_name }} -C dist AnkiForge

      # ── BUILD WINDOWS ───────────────────────────────────────────
      - name: Build Standalone Windows App (PyInstaller)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller `
            --name="AnkiForge" `
            --onedir `
            --windowed `
            --collect-data="qtawesome" `
            --hidden-import="peewee" `
            --hidden-import="jinja2.ext" `
            --hidden-import="PySide6.QtWebEngineCore" `
            --hidden-import="PySide6.QtWebEngineWidgets" `
            --noconfirm `
            --distpath dist `
            src/ankiforge/__main__.py
          Compress-Archive -Path dist/AnkiForge -DestinationPath ${{ matrix.asset_name }}
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
