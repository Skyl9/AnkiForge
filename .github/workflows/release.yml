name: Release - Multi-Platform Binaries (Nuitka)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: 📦 Build Nuitka Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: AnkiForge-macOS
            asset_name: AnkiForge-macOS.zip
          - os: ubuntu-latest
            artifact_name: AnkiForge-Linux
            asset_name: AnkiForge-Linux.tar.gz
          - os: windows-latest
            artifact_name: AnkiForge-Windows
            asset_name: AnkiForge-Windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies & Compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb1 \
            gcc \
            g++ \
            ccache \
            patchelf

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile Native C Levenshtein Extension (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          gcc -shared -o src/ankiforge/c_ext/levenshtein_distance.so -fPIC src/ankiforge/c_ext/levenshtein_distance.c || true

      - name: Compile Native C Levenshtein Extension (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -shared -o src/ankiforge/c_ext/levenshtein_distance.dll src/ankiforge/c_ext/levenshtein_distance.c || true
        shell: bash

      - name: Set up MSVC x64 Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── BUILD MACOS AVEC NUITKA ─────────────────────────────────
      - name: Build Standalone macOS Bundle (Nuitka)
        if: runner.os == 'macOS'
        run: |
          export CFLAGS="-O2 -fno-slp-vectorize -fno-vectorize"
          export CXXFLAGS="-O2 -fno-slp-vectorize -fno-vectorize"
          uv run python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name="AnkiForge" \
            --macos-app-version="0.2.0" \
            --enable-plugin=pyside6 \
            --include-package-data=qtawesome \
            --include-data-dir=src/ressources=src/ressources \
            --include-data-dir=src/ressources=ressources \
            --include-data-dir=src/ankiforge/c_ext=src/ankiforge/c_ext \
            --include-data-dir=src/ankiforge/c_ext=ankiforge/c_ext \
            --low-memory \
            --lto=no \
            --output-dir=dist \
            --assume-yes-for-downloads \
            src/ankiforge/__main__.py
          cd dist
          if [ -d "__main__.app" ]; then
            rm -rf AnkiForge.app
            mv __main__.app AnkiForge.app
          fi
          zip -r ../${{ matrix.asset_name }} AnkiForge.app

      # ── BUILD LINUX AVEC NUITKA ─────────────────────────────────
      - name: Build Standalone Linux App (Nuitka)
        if: runner.os == 'Linux'
        run: |
          export CFLAGS="-O2 -fno-slp-vectorize -fno-vectorize"
          export CXXFLAGS="-O2 -fno-slp-vectorize -fno-vectorize"
          uv run python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-package-data=qtawesome \
            --include-data-dir=src/ressources=src/ressources \
            --include-data-dir=src/ressources=ressources \
            --include-data-dir=src/ankiforge/c_ext=src/ankiforge/c_ext \
            --include-data-dir=src/ankiforge/c_ext=ankiforge/c_ext \
            --low-memory \
            --lto=no \
            --output-dir=dist \
            --output-filename=AnkiForge \
            --assume-yes-for-downloads \
            src/ankiforge/__main__.py
          cd dist
          if [ -d "AnkiForge.dist" ]; then
            mv AnkiForge.dist AnkiForge
          elif [ -d "__main__.dist" ]; then
            mv __main__.dist AnkiForge
          fi
          tar -czf ../${{ matrix.asset_name }} AnkiForge

      # ── BUILD WINDOWS AVEC NUITKA ───────────────────────────────
      - name: Build Standalone Windows App (Nuitka)
        if: runner.os == 'Windows'
        run: |
          $env:_CL_ = "/bigobj /Zm200"
          uv run python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-package-data=qtawesome `
            --include-data-dir=src/ressources=src/ressources `
            --include-data-dir=src/ressources=ressources `
            --include-data-dir=src/ankiforge/c_ext=src/ankiforge/c_ext `
            --include-data-dir=src/ankiforge/c_ext=ankiforge/c_ext `
            --low-memory `
            --lto=no `
            --output-dir=dist `
            --output-filename=AnkiForge.exe `
            --assume-yes-for-downloads `
            src/ankiforge/__main__.py
          cd dist
          if (Test-Path "AnkiForge.dist") {
            Rename-Item -Path "AnkiForge.dist" -NewName "AnkiForge"
          } elseif (Test-Path "__main__.dist") {
            Rename-Item -Path "__main__.dist" -NewName "AnkiForge"
          }
          Compress-Archive -Path AnkiForge -DestinationPath ../${{ matrix.asset_name }}
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
