name: Release - Automated Multi-OS Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du Tag de Release (ex: v0.2.0)'
        required: true
        default: 'v0.2.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  ANKIFORGE_MOCK_WEBENGINE: "1"

jobs:
  # ── 1. Construction des Binaires Multi-OS ──
  build:
    name: 📦 Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ankiforge-linux-x86_64.tar.gz
            arch: x86_64
            os_name: linux
          - os: macos-latest
            artifact_name: ankiforge-macos-arm64.zip
            arch: arm64
            os_name: macos
          - os: windows-latest
            artifact_name: ankiforge-windows-x64.zip
            arch: x64
            os_name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies & Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            ccache \
            gcc || true

      - name: Install macOS Build Tools (ccache)
        if: runner.os == 'macOS'
        run: |
          brew install ccache || true

      - name: Cache Nuitka & C Compiler Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ${{ env.LOCALAPPDATA }}\Nuitka\Nuitka\Cache
          key: nuitka-${{ matrix.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-${{ matrix.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (Production runtime + Nuitka only)
        run: uv sync --frozen --no-dev --group build

      - name: Build Binary with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build_script/build_prod_linux.sh
          ./build_script/build_prod_linux.sh

      - name: Build Binary with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_script/build_prod_mac.sh
          ./build_script/build_prod_mac.sh

      - name: Build Binary with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File build_script/build_prod_windows.ps1
        shell: pwsh

      - name: Ad-Hoc Code Sign macOS Binary Bundle
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist_prod/AnkiForge.app

      - name: Smoke Test Binary (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum ./dist_prod/AnkiForge.dist/AnkiForge --smoke-test

      - name: Smoke Test Binary (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist_prod/AnkiForge.app/Contents/MacOS/AnkiForge --smoke-test

      - name: Smoke Test Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist_prod\AnkiForge.dist\AnkiForge.exe --smoke-test
        shell: pwsh

      - name: Package Linux Archive (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd dist_prod
          tar -czf ../${{ matrix.artifact_name }} AnkiForge.dist/
          cd ..
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package macOS Archive (.zip)
        if: runner.os == 'macOS'
        run: |
          cd dist_prod
          zip -r ../${{ matrix.artifact_name }} AnkiForge.app/
          cd ..
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Windows Archive (.zip)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist_prod\AnkiForge.dist -DestinationPath ${{ matrix.artifact_name }}
          $hash = (Get-FileHash ${{ matrix.artifact_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -Encoding ascii ${{ matrix.artifact_name }}.sha256
        shell: pwsh

      - name: Upload Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  # ── 2. Publication Automatique de la GitHub Release ──
  publish:
    name: 🚀 Publish GitHub Release & Cryptographic Attestations
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Consolidate SHA-256 Checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          echo "### 🔒 Empreintes Cryptographiques SHA-256 :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat checksums.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Cryptographic Build Attestation (SLSA Level 3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/ankiforge-linux-x86_64.tar.gz
            release-assets/ankiforge-macos-arm64.zip
            release-assets/ankiforge-windows-x64.zip

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "AnkiForge ${{ steps.tag.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/ankiforge-linux-x86_64.tar.gz
            release-assets/ankiforge-macos-arm64.zip
            release-assets/ankiforge-windows-x64.zip
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
