name: User Website (ankidraft.app)

on:
  push:
    branches:
      - main
      - master
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages-website"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Astro Starlight to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "website/package-lock.json"

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Verify FR/EN i18n parity
        working-directory: website
        run: npm run check:i18n

      - name: Build static website
        working-directory: website
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankidraft-website-dist
          path: website/dist

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=ankidraft
