<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #181825; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #cdd6f4; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #a6adc8; text-anchor: middle; }
      .panel { fill: #1e1e2e; stroke: #313244; stroke-width: 1.5; rx: 12px; }
      .panel-header-red { fill: #f38ba8; rx: 6px; }
      .panel-header-blue { fill: #89b4fa; rx: 6px; }
      .header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #181825; text-anchor: middle; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #cdd6f4; }
      .box-problem { fill: #313244; stroke: #f38ba8; stroke-width: 1; rx: 8px; }
      .box-solution { fill: #313244; stroke: #a6e3a1; stroke-width: 1; rx: 8px; }
      .box-lbl-red { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f38ba8; }
      .box-lbl-green { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #a6e3a1; }
      .box-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #cdd6f4; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #a6adc8; }
      .arrow-down { stroke: #a6e3a1; stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a6e3a1"/>
    </marker>
  </defs>

  <!-- Arrière-plan global -->
  <rect width="920" height="460" class="bg" rx="16"/>

  <!-- Titre -->
  <text x="460" y="38" class="title">Prévention des Cartes Zombies &amp; Intégrité du Rendu</text>
  <text x="460" y="58" class="subtitle">Deux mécanismes complémentaires pour garantir une collection saine sans fiches fantômes</text>

  <!-- VOLET GAUCHE : Cartes Zombies -->
  <g transform="translate(35, 80)">
    <rect width="410" height="350" class="panel" stroke="#f38ba8" stroke-width="1.5"/>
    <rect x="20" y="18" width="120" height="22" class="panel-header-red"/>
    <text x="80" y="33" class="header-text">ANTI-ZOMBIES</text>
    <text x="150" y="34" class="panel-title">1. Cartes Supprimées</text>

    <!-- Problème -->
    <rect x="20" y="55" width="370" height="95" class="box-problem"/>
    <text x="32" y="75" class="box-lbl-red">⚠️ Le risque des fusions naïves :</text>
    <text x="32" y="95" class="box-text">Si vous supprimez une carte inutile dans Anki, un système</text>
    <text x="32" y="112" class="box-text">de fusion incrémentale classique la conserve dans sa base,</text>
    <text x="32" y="130" class="box-sub">puis la réinjecte comme « zombie » lors de votre prochain export.</text>

    <!-- Flèche transition -->
    <path d="M 205 155 L 205 180" class="arrow-down" marker-end="url(#arr-green)"/>

    <!-- Solution -->
    <rect x="20" y="188" width="370" height="135" class="box-solution"/>
    <text x="32" y="210" class="box-lbl-green">✅ La solution AnkiForge (Remplacement .colpkg) :</text>
    <text x="32" y="232" class="box-text">• L'import de collection remplace intégralement les cartes</text>
    <text x="32" y="250" class="box-text">• Toute carte supprimée dans Anki disparaît d'AnkiForge</text>
    <text x="32" y="268" class="box-text">• Zéro carte zombie résiduelle ou réapparition fantôme</text>
    <text x="32" y="295" class="box-sub">🛡️ Sauvegarde SQLite automatique avant chaque remplacement.</text>
  </g>

  <!-- VOLET DROIT : Règle de rendu recto non-vide -->
  <g transform="translate(475, 80)">
    <rect width="410" height="350" class="panel" stroke="#89b4fa" stroke-width="1.5"/>
    <rect x="20" y="18" width="130" height="22" class="panel-header-blue"/>
    <text x="85" y="33" class="header-text">MOTEUR DE RENDU</text>
    <text x="160" y="34" class="panel-title">2. Règle du Recto Non-Vide</text>

    <!-- Problème -->
    <rect x="20" y="55" width="370" height="95" class="box-problem"/>
    <text x="32" y="75" class="box-lbl-red">⚠️ Le risque des modèles multi-gabarits :</text>
    <text x="32" y="95" class="box-text">Dans un modèle « Basique (avec inversée optionnelle) »,</text>
    <text x="32" y="112" class="box-text">si le champ optionnel n'est pas renseigné, un moteur naïf</text>
    <text x="32" y="130" class="box-sub">crée tout de même une 2e carte physique au recto entièrement blanc.</text>

    <!-- Flèche transition -->
    <path d="M 205 155 L 205 180" class="arrow-down" marker-end="url(#arr-green)"/>

    <!-- Solution -->
    <rect x="20" y="188" width="370" height="135" class="box-solution"/>
    <text x="32" y="210" class="box-lbl-green">✅ Règle officielle Anki implémentée :</text>
    <text x="32" y="232" class="box-text">• Parser récursif : évaluation des quantificateurs {{#Champ}}</text>
    <text x="32" y="250" class="box-text">• Si le recto calculé ne contient aucun texte visible,</text>
    <text x="32" y="268" class="box-text">  la carte physique n'est JAMAIS créée dans la Forge</text>
    <text x="32" y="295" class="box-sub">✨ Parité absolue avec Anki : votre collection reste propre.</text>
  </g>
</svg>
