site_name: AnkiForge
site_description: Documentation officielle de l'application AnkiForge
site_author: Tristan


theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre

nav:
  - Accueil: index.md
  - Architecture: architecture.md
  - IA & Prompts: ia_prompts.md
  - Référence Code: code_reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true