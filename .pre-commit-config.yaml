# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-check
        name: mypy type checking (pre-push)
        entry: uv run mypy src/ankiforge
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: fast-unit-tests
        name: fast unit tests (pre-push)
        entry: uv run pytest -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-push]
